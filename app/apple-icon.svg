<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#09090b" />
  <!-- Radial Glow -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)" />
  <!-- Border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" />
  <!-- Monogram -->
  <text x="16" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="900" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="-0.5">&gt;ZR</text>
</svg>
